; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@^8.0.0
framework = arduino
build_unflags = -std=gnu++11 -DCORE_DEBUG_LEVEL
build_flags = -std=gnu++2a -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1 -DCORE_DEBUG_LEVEL=3  -DLOG_LOCAL_LEVEL=ESP_LOG_INFO 
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/SPI/src"
lib_deps = 
    esp32async/ESPAsyncWebServer@^3.12.1
    bblanchon/ArduinoJson@^6.21.6
    lennarthennigs/ESP Telnet@^2.3.0
    marian-craciunescu/ESP32Ping@^1.7
    CRMui3-custom
    des
board_build.partitions = min_spiffs.csv
monitor_speed = 19200
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py

[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DETH_ENABLED=0

[env:wt32-eth01]
board = wt32-eth01
build_flags = ${env.build_flags} -DETH_ENABLED=1